
<!DOCTYPE html>
<html>
<head>
    <title>Car Booking</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">🚗 Book Your Ride</h1>
    <input type="text" id="search" class="form-control mb-4" placeholder="Search car..." onkeyup="filterCars()">
   <div class="row">
    {% for car in cars %}
    <div class="col-md-4">
        <div class="card shadow mb-4">
            <img src="/static/{{ car|lower }}.jpg" class="card-img-top" height="200">

            <div class="card-body text-center">
                <h4>{{ car }}</h4>
                <a href="/book/{{ car }}" class="btn btn-primary">Book Now</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
</div>
<script>
function filterCars() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let title = card.innerText.toLowerCase();
        card.style.display = title.includes(input) ? "block" : "none";
    });
}
</script>
</body>
</html>
