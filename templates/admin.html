<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">📊 Admin Dashboard</h2>

    <table class="table table-striped table-hover shadow">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Car</th>
                <th>Date</th>
                <th>Location</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for b in bookings %}
            <tr>
                <td>{{ b[0] }}</td>
                <td>{{ b[1] }}</td>
                <td>{{ b[2] }}</td>
                <td>{{ b[3] }}</td>
                <td>{{ b[4] }}</td>
                <td>{{ b[5] }}</td>
                <td>
    <span class="badge bg-warning">{{ b[6] }}</span><br><br>

    <a href="/update/{{ b[0] }}/Confirmed" class="btn btn-success btn-sm">Confirm</a>
    <a href="/update/{{ b[0] }}/Completed" class="btn btn-primary btn-sm">Done</a>
    <a href="/delete/{{ b[0] }}" class="btn btn-danger btn-sm">Delete</a>
</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/logout" class="btn btn-secondary">Logout</a>
</div>

</body>
</html>
